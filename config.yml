llm:
  # Provider: "openai" or "ollama"
  # - openai: uses the OpenAI API (requires API_KEY / OPENAI_API_KEY env var)
  # - ollama: uses Ollama Cloud (https://ollama.com) with a paid Ollama account,
  #           or a local Ollama server. Requires OLLAMA_API_KEY env var for cloud.
  provider: ollama

  # Base URL override. Leave empty for provider defaults:
  #   openai -> https://api.openai.com/v1
  #   ollama -> https://ollama.com  (Ollama Cloud; or http://localhost:11434 for local)
  base_url:

  # Default model per provider. Override freely.
  #   openai examples: gpt-4o-mini, gpt-4o
  #   ollama cloud examples: gpt-oss:120b, gpt-oss:20b, deepseek-v3, qwen3:235b,
  #                         llama3.3, kimi-k2.6, glm-4.6
  model: gpt-oss:120b

  # Optional model used for shorts/voiceover generation (heavier task).
  # Falls back to `model` if empty.
  model_heavy:

  # Ollama thinking/reasoning mode (ignored for the openai provider).
  # Thinking models burn the num_predict budget on internal reasoning before
  # emitting any visible content, which can return empty summaries. Disable
  # for summarization unless you know your model needs thinking.
  think: false

proxy:
  # VPS/datacenter IPs usually get blocked by YouTube — use a residential proxy there. See docs/RUNBOOK.md.
  # Master switch
  enabled: false

  # Examples (depending on environment):
  # http:  socks5h://127.0.0.1:9050
  # https: socks5h://127.0.0.1:9050
  # "http":  "socks5h://torproxy:9050",
  # "https": "socks5h://torproxy:9050",
  http:
  https:

transcription:
  # Local Whisper fallback for videos WITHOUT captions. Needs the optional
  # extras: pip install -r requirements-whisper.txt
  # fallback: auto   = captions first, Whisper only if captions missing
  #           off    = never transcribe locally (old behavior)
  #           force  = always transcribe locally (testing/low-quality captions)
  fallback: auto
  # faster-whisper model size: tiny | base | small (default) | medium
  model: small
